[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aidoo-mcp"
version = "0.1.1"
description = "Connect any MCP client to your Odoo ERP through Aidoo"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Aidoo", email = "support@aidoo.ai" }]
keywords = ["odoo", "erp", "mcp", "model-context-protocol", "aidoo", "mcp-name:ai.aidoo/aidoo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.9",
    "anyio>=4.5",
]

[project.urls]
Homepage = "https://aidoo.ai"
Documentation = "https://aidoo.ai/docs"
Source = "https://github.com/eantoniomota/aidoo-mcp"
Issues = "https://github.com/eantoniomota/aidoo-mcp/issues"

[project.scripts]
aidoo-mcp = "aidoo_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aidoo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
